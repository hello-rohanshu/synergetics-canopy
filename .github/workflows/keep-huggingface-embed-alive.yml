name: Keep Synergetics Embed Alive

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:          # lets you trigger it manually from GitHub too

jobs:
  wake-space:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Space via HF API
        run: |
          curl -s -o /dev/null -w "Wake API status: %{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            "https://huggingface.co/api/spaces/hello-rohanshu/synergetics-embed/restart"

      - name: Wait for Space to boot
        run: sleep 30

      - name: Ping health endpoint
        run: |
          curl -s -o response.json -w "Health status: %{http_code}\n" \
            -X GET \
            "https://hello-rohanshu-synergetics-embed.hf.space/health"
          echo "Response body:"
          cat response.json
